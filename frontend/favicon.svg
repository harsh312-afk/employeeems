<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#emsGrad)"/>

  <!-- Enterprise Building Silhouette -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Main corporate tower -->
    <path d="M12 22 C12 20.895 12.895 20 14 20 L30 20 C31.105 20 32 20.895 32 22 L32 50 L12 50 Z" opacity="0.95"/>
    <!-- Windows -->
    <rect x="16" y="24" width="4" height="4" rx="1" fill="#1d4ed8" opacity="0.75"/>
    <rect x="24" y="24" width="4" height="4" rx="1" fill="#1d4ed8" opacity="0.75"/>
    <rect x="16" y="31" width="4" height="4" rx="1" fill="#1d4ed8" opacity="0.75"/>
    <rect x="24" y="31" width="4" height="4" rx="1" fill="#1d4ed8" opacity="0.75"/>
    <rect x="16" y="38" width="4" height="4" rx="1" fill="#1d4ed8" opacity="0.75"/>
    <rect x="24" y="38" width="4" height="4" rx="1" fill="#1d4ed8" opacity="0.75"/>

    <!-- Door -->
    <rect x="19" y="44" width="6" height="6" rx="1" fill="#1d4ed8" opacity="0.9"/>
  </g>

  <!-- Employee User Badge (Front Right) -->
  <g filter="url(#shadow)">
    <!-- Circular outline glow -->
    <circle cx="43" cy="38" r="13" fill="#ffffff"/>
    
    <!-- User Head -->
    <circle cx="43" cy="33" r="4.5" fill="#2563eb"/>
    
    <!-- User Body / Shoulders -->
    <path d="M34.5 45 C34.5 41 38 39.5 43 39.5 C48 39.5 51.5 41 51.5 45 C51.5 46.5 50.5 48 48 48 L38 48 C35.5 48 34.5 46.5 34.5 45 Z" fill="#2563eb"/>
  </g>
</svg>
